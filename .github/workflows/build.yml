name: Build APK
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Unzip Project
        run: unzip -q QuickCopy.zip
        
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
          
      - name: Build with Gradle
        run: gradle assembleDebug --no-daemon
        working-directory: QuickCopy
        
      - uses: actions/upload-artifact@v4
        with:
          name: QuickCopy-apk
          path: QuickCopy/app/build/outputs/apk/debug/app-debug.apk
